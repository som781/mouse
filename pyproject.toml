[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mouse"
version = "0.1.0"
description = "A lightweight, modular AI agent harness."
requires-python = ">=3.10"
readme = { text = "Mouse — lightweight AI agent harness.", content-type = "text/plain" }
dependencies = [
    "litellm>=1.40.0",
    "mcp>=1.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
mouse = "mouse.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mouse"]
